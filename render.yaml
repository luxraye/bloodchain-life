# =============================================================================
# Bloodchain — Render Blueprint (v2 / fresh stack)
# =============================================================================
#
# Use this after initializing a NEW Git repo and connecting it in Render.
# Service names below are intentionally different from any prior Blueprint so
# Render creates new resources instead of reusing broken state.
#
# Deploy: Render Dashboard → New Blueprint → connect repo → branch → apply.
#
# Public URLs: https://bloodchain.life (demo hub) and https://<app>.bloodchain.life
# DNS setup: docs/DNS-bloodchain.life.md
#
# Stack: bc-api + 9 static constellation apps + bc-demo-hub (11 services total).
#
# =============================================================================

databases:
  - name: bc-infra-db
    plan: free
    databaseName: bloodchain
    user: bloodchain

envVarGroups:
  - name: bc-vite-api
    envVars:
      - key: VITE_API_URL
        value: https://api.bloodchain.life/api/v1

  - name: bc-demo-hub-links
    envVars:
      - key: VITE_HIGH_COMMAND_URL
        value: https://command.bloodchain.life
      - key: VITE_MARS_LAB_URL
        value: https://mars.bloodchain.life
      - key: VITE_VOYAGER_URL
        value: https://voyager.bloodchain.life
      - key: VITE_SCYTHER_URL
        value: https://scyther.bloodchain.life
      - key: VITE_AZURE_URL
        value: https://azure.bloodchain.life
      - key: VITE_TRANSFUSE_URL
        value: https://transfuse.bloodchain.life
      - key: VITE_HELIX_URL
        value: https://helix.bloodchain.life
      - key: VITE_CHRONICLE_URL
        value: https://chronicle.bloodchain.life
      - key: VITE_SENTINEL_URL
        value: https://sentinel.bloodchain.life

services:
  - type: web
    name: bc-api
    runtime: node
    region: oregon
    plan: free
    rootDir: bloodchain-core
    buildCommand: yarn install && yarn prisma generate && yarn build
    startCommand: yarn prisma migrate deploy && yarn start
    healthCheckPath: /health
    domains:
      - api.bloodchain.life
    envVars:
      - key: NODE_VERSION
        value: "22.22.2"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: bc-infra-db
          property: connectionString
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false

  - type: web
    name: bc-azure
    runtime: static
    rootDir: azure
    buildCommand: yarn install && yarn workspace @bloodchain/ui build && yarn build
    staticPublishPath: dist
    domains:
      - azure.bloodchain.life
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: "22.22.2"
      - fromGroup: bc-vite-api
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false

  - type: web
    name: bc-high-command
    runtime: static
    rootDir: high-command
