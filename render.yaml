# =============================================================================
# Bloodchain — Render Blueprint
# =============================================================================
#
# Hobby custom domains: use ONE slot on bc-demo-hub (bloodchain.life).
# All other static apps use *.onrender.com — share those URLs directly when pitching.
# API: bc-api.onrender.com (set VITE_API_URL in bc-vite-api after deploy).
#
# Demo hub: marketing only (no public app links). See demo-hub/src/content/apps.js
#
# =============================================================================

databases:
  - name: bc-infra-db
    plan: free
    databaseName: bloodchain
    user: bloodchain

envVarGroups:
  - name: bc-vite-api
    envVars:
      # Replace host after first bc-api deploy (Dashboard → bc-api → URL)
      - key: VITE_API_URL
        value: https://bc-api-lu8j.onrender.com/api/v1

services:
  - type: web
    name: bc-api
    runtime: node
    region: oregon
    plan: free
    rootDir: bloodchain-core
    buildCommand: yarn install && yarn prisma generate && yarn build
    startCommand: yarn prisma migrate deploy && yarn start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22.22.2"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: bc-infra-db
          property: connectionString
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false

  - type: web
    name: bc-demo-hub
    runtime: static
    rootDir: demo-hub
    buildCommand: cd .. && yarn install && yarn workspace demo-hub build
    staticPublishPath: dist
    domains:
      - bloodchain.life
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: "22.22.2"

  - type: web
    name: bc-high-command
    runtime: static
    rootDir: high-command
    buildCommand: cd .. && yarn install && yarn workspace @bloodchain/ui build && yarn workspace high-command build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: "22.22.2"
      - fromGroup: bc-vite-api
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false

  - type: web
    name: bc-mars-lab
